<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>드론 코인 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #1d2b45; overflow: hidden;
    font-family: var(--font); user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #87ceeb;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 위로 버튼 */
  #upBtn {
    position: absolute; right: 3%; bottom: 6%;
    width: 12.5%; aspect-ratio: 1; border-radius: 50%;
    border: 5px solid #fff; background: radial-gradient(circle at 35% 30%, #ffd166, #ff8c1a);
    color: #fff; font-family: var(--font); font-size: clamp(14px, 2.6vw, 30px);
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 6px 0 #c35f00, 0 10px 20px rgba(0,0,0,.3);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none; opacity: .72;
  }
  #upBtn.pressed { opacity: .9; }
  #upBtn .arrow { font-size: 1.8em; line-height: .9; }
  #upBtn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #c35f00, 0 4px 10px rgba(0,0,0,.3); }
  #upBtn.show { display: flex; }

  #muteBtn {
    position: absolute; top: 1.6%; right: 1.2%;
    width: 5.2%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff;
    background: rgba(40, 60, 100, .55); color: #fff; font-size: clamp(12px, 2vw, 22px);
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }

  /* 오버레이 */
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(20, 35, 70, .45);
  }
  #overlay.show { display: flex; }
  .panel {
    background: #fffdf5; border: 6px solid #ffb703; border-radius: 28px;
    padding: 2.2% 4%; text-align: center; color: #3a2e1f;
    width: 70%; max-height: 92%; overflow: auto;
    box-shadow: 0 10px 0 #e08e00, 0 16px 40px rgba(0,0,0,.35);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h1 { margin: .2em 0 .25em; font-size: clamp(22px, 5vw, 56px); color: #ff7b00; font-weight: normal;
              text-shadow: 0 3px 0 #ffe08a; }
  .panel h2 { margin: .2em 0; font-size: clamp(18px, 3.6vw, 40px); color: #ff7b00; font-weight: normal; }
  .panel p { margin: .4em 0; font-size: clamp(12px, 2vw, 22px); line-height: 1.5; }
  .panel .big { font-size: clamp(16px, 3vw, 34px); }
  .btns { display: flex; gap: 2%; justify-content: center; flex-wrap: wrap; margin-top: 3%; }
  .btn {
    font-family: var(--font); font-size: clamp(14px, 2.4vw, 28px);
    border: none; border-radius: 999px; padding: .45em 1.3em; cursor: pointer;
    background: #4cc9f0; color: #fff; box-shadow: 0 5px 0 #2a8fb0;
    margin: .2em 0;
  }
  .btn.primary { background: #ff8c1a; box-shadow: 0 5px 0 #c35f00; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 2% 0 1%; }
  .stageBtn {
    font-family: var(--font); border: 4px solid #ffd166; background: #fff4d6; border-radius: 18px;
    padding: 2% 2%; cursor: pointer; color: #5a4632; font-size: clamp(10px, 1.5vw, 18px);
    box-shadow: 0 4px 0 #e0b84f;
  }
  .stageBtn b { display: block; font-size: 1.3em; font-weight: normal; color: #ff7b00; }
  .stageBtn:disabled { filter: grayscale(1); opacity: .5; cursor: not-allowed; }
  .stageBtn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 #e0b84f; }
  .panel.wide { width: 94%; padding: 1% 2%; }
  .panel.wide h2 { margin: 0; }
  .panel.wide h1 { margin: 0 0 .15em; }
  .panel.wide .howto p { margin: .15em 0; }
  .panel.wide .stages { width: 80%; margin: 1.5% auto .5%; }
  .panel.wide p { margin: .2em 0; }
  .panel small { font-size: .85em; color: #7a6a55; }
  .droneGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 1% 0 0; }
  .droneCard {
    font-family: var(--font); border: 4px solid #e8dcc0; background: #eaf7ff; border-radius: 16px;
    padding: 1% 1% 3%; cursor: pointer; color: #4a3a28; font-size: clamp(9px, 1.3vw, 16px);
    display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 #d8ccb0;
  }
  .droneCard canvas { width: 100%; aspect-ratio: 8 / 5; }
  .droneCard.selected { border-color: #ff8c1a; background: #fff1dc; box-shadow: 0 4px 0 #c35f00; }
  .droneCard.selected span::before { content: '✔ '; color: #ff7b00; }
  .droneCard.special:not(:disabled) { background: linear-gradient(135deg, #fff8d6, #f3e5ff); border-color: #ffd54f; }
  .droneCard:disabled { cursor: not-allowed; background: #eee; }
  .droneCard:disabled canvas { filter: grayscale(1) brightness(.6); opacity: .45; }
  .droneCard:not(:disabled):active { transform: translateY(3px); }
  .howto { background: #e9f7ff; border-radius: 16px; padding: 1% 3%; }
  .rotate-hint { display: none; position: fixed; inset: 0; background: #1d2b45; color: #fff;
    align-items: center; justify-content: center; text-align: center; font-size: 24px; z-index: 10; padding: 20px; }
  @media (orientation: portrait) and (max-width: 700px) { .rotate-hint { display: flex; } }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <button id="upBtn" aria-label="위로 가기"><span class="arrow">▲</span>위로</button>
    <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>
  <div class="rotate-hint">📱 화면을 가로로 돌려 주세요!</div>

  <script src="backgrounds.js"></script>
  <script src="drones.js"></script>
  <script src="game.js"></script>
</body>
</html>
